        choice — you can and should disagree with any of them by moving the sliders.</p> <h3 class="svelte-1n46o8q">Mechanism blend</h3> <p><strong>Yard-sale (mechanism = 0):</strong> two random agents wager a fraction of the poorer agent's wealth
        on a biased coin flip. This is the classic non-ergodic kinetic-exchange process behind claims that repeated
        wealth-proportional trading mathematically converges to monopoly, regardless of the asset involved.</p> <p><strong>Buy-and-hold (mechanism = 1):</strong> a buyer is selected with probability proportional to
        wealth<sup>exponent</sup> (preferential attachment — the rich can deploy more capital), and acquires a small
        unit sourced diffusely from the rest of the market. There is no symmetric downside risk here — it's a
        one-directional accumulation process, not a wager.</p> <h3 class="svelte-1n46o8q">Monetary regime blend</h3> <p><strong>Fiat (regime = 0):</strong> two effects scale to full strength — a Cantillon-style annual injection to
        above-median holders (representing newly created money reaching asset owners first), and credit leverage at
        its fiat-side maximum, letting above-median holders wager more than their raw wealth in yard-sale trades.</p> <p><strong>Bitcoin (regime = 1):</strong> the Cantillon injection fades fully to zero (no discretionary
        issuance). Credit leverage fades toward its <em>floor</em>, not to zero — reduced but non-zero lending,
        modeled as a lower ceiling on the amplification itself rather than cutting anyone off. This is a deliberate
        choice: real economies under a bitcoin standard would likely still see collateralized lending, just smaller
        and shorter-duration than fiat-era leverage.</p> <p><strong>On scope:</strong> this model treats the wider economy (wages, venture financing, goods and
        services) as out of scope by design — only BTC-denominated wealth dynamics are simulated. That also means it
        doesn't distinguish debt-financed ventures from equity/profit-share-financed ones; if you believe ventures
        shift toward equity financing under hard money, that shows up here only indirectly, as reduced overall credit
        leverage rather than as a separate financing-structure mechanic.</p> <p><strong>On spending:</strong> the spending-rate friction is a flat annual rate, deliberately not a function of
        price appreciation — reflecting the assumption that non-monetary utility (needing to live) keeps spending
        roughly stable regardless of how much the asset has appreciated.</p> <p><strong>Realistic regime setting:</strong> a pure 0 or pure 1 regime is a stress-test extreme. A more
        realistic near/medium-term expectation is a hybrid fiat/bitcoin economy — try the regime slider around
        0.3–0.6 rather than either endpoint.</p> <h3 class="svelte-1n46o8q">AI-driven inequality</h3> <p>An independent annual return injected to the top decile, representing automation capital returns accruing to
        owners rather than labor. This is deliberately orthogonal to the monetary regime slider, so you can test your
        opening claim: inequality driven by automation trends independently of whether the underlying money is fiat
        or bitcoin.</p> <h3 class="svelte-1n46o8q">Frictions</h3> <ul><li><strong>Spending</strong> is redistributed equally to all other agents (money re-entering the economy) — a mild equalizing force.</li> <li><strong>Lost keys</strong> are stochastic and permanently removed from the system — deflationary, not redistributive.</li> <li><strong>Inheritance</strong> splits an agent's wealth across N new heir-agents — a strong equalizing force at realistic rates.</li> <li><strong>Redistribution tax</strong> is your explicit UBI lever — skims wealth above a multiple of mean wealth and splits it equally among everyone, independent of the monetary regime slider. The threshold only matters when the tax rate is above zero; very high multiples often tax almost nobody in short runs.</li></ul> <h3 class="svelte-1n46o8q">New entrants &amp; price</h3> <p>Entrants arrive with fixed fiat capital but convert it to the asset at a price that appreciates over time, so
        later entrants receive fewer units per dollar. The "cohort share" chart on the Simulation tab lets you see
